<html>
    <head>
        <link href="index.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container">
            <header>
                <img class="main-logo" src="./Images/Logo_Ai.png"/>
            </header>
            <form>
                <h2>Create Account</h2>
                <label for="UserName">
                    Enter Username
                </label>
                <input type="text"
                       name="UserName"
                       id="UserName"
                       maxlength="10"
                       minlength="3" 
                       pattern="[a-zA-Z0-9]+"/>

                <label for="UserEmail">
                    Enter Email
                </label>
                <input type="email"
                       name="UserEmail"
                       id="UserEmail" />

                <label for="UserPassword">
                    Enter Password
                </label>
                <input type="password"
                       name="UserPassword"
                       id="UserPassword"
                       minlength="6" />

                <button type="submit">Submit</button>
            </form>
            <footer>
                <h3>Contact me</h3>
                <p>JoshuaAndrewStone@Gmail.com</p>
                <p>+44 706320433</p>
            </footer>
        </div>
    </body>
</html>
